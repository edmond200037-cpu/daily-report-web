name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  database-tests:
    uses: ./.github/workflows/database-tests.yml
  build:
    needs: database-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ./
      - run: npm run build
        env:
          BASE_PATH: /daily-report-web/
          # Vite 只會在建置階段讀取 VITE_*；部署版不可依賴開發機的 .env.local。
          # 請在 GitHub repository Actions secrets 設定這兩個值。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  database-deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: npm ci
      - run: npm ci --prefix scripts/db-tests
      - run: node scripts/deploy-database.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: node scripts/check-sync-api.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SYNC_CHECK_EMAIL: ${{ secrets.SUPABASE_SYNC_CHECK_EMAIL }}
          SUPABASE_SYNC_CHECK_PASSWORD: ${{ secrets.SUPABASE_SYNC_CHECK_PASSWORD }}
          SUPABASE_SYNC_CHECK_SITE_ID: ${{ secrets.SUPABASE_SYNC_CHECK_SITE_ID }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [build, database-deploy]
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
