name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  database-tests:
    uses: ./.github/workflows/database-tests.yml
  build:
    needs: database-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ./
      - run: npm run build
        env:
          BASE_PATH: /daily-report-web/
          # Vite 只會在建置階段讀取 VITE_*；部署版不可依賴開發機的 .env.local。
          # 請在 GitHub repository Actions secrets 設定這兩個值。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # 不含任何 secret：只把這次推送會動到的 migration 列在執行摘要，讓核准者在按下核准前看得到。
  migration-review:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: 列出待核准的資料庫變更
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..$GITHUB_SHA"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$GITHUB_SHA~1..$GITHUB_SHA"
          fi
          files=$(git diff --name-only "$range" -- supabase/migrations 2>/dev/null || true)
          {
            echo '## 待核准的資料庫變更'
            echo
            if [ -z "$files" ]; then
              echo '這次推送沒有新的 migration；核准後只會執行 history 預檢、dry-run 與 Data API 契約檢查。'
            else
              echo '核准後會套用到**正式資料庫**，請先檢視這些檔案的內容：'
              echo
              echo "$files" | sed 's/^/- `/; s/$/`/'
            fi
            echo
            echo "比對範圍：\`$range\`"
          } >> "$GITHUB_STEP_SUMMARY"
  # 正式資料庫只由 main 發布，且 production-database environment 必須設定 Required reviewers
  # （核准前不會取得任何資料庫 secret）。從其他分支手動觸發時整個後半段會被略過。
  database-deploy:
    needs: [build, migration-review]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: npm ci
      - run: npm ci --prefix scripts/db-tests
      - run: node scripts/deploy-database.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: node scripts/check-sync-api.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SYNC_CHECK_EMAIL: ${{ secrets.SUPABASE_SYNC_CHECK_EMAIL }}
          SUPABASE_SYNC_CHECK_PASSWORD: ${{ secrets.SUPABASE_SYNC_CHECK_PASSWORD }}
          SUPABASE_SYNC_CHECK_SITE_ID: ${{ secrets.SUPABASE_SYNC_CHECK_SITE_ID }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [build, database-deploy]
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
